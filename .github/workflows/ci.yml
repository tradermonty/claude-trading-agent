name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run quality gate
        run: scripts/check_quality.sh

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install detect-secrets
        run: python -m pip install "detect-secrets>=1.5.0"

      - name: Detect new secrets
        run: |
          detect-secrets scan \
            --exclude-files '\.env$|\.json$|\.csv$|\.md$|\.zip$|\.baseline$' \
            > /tmp/new_scan.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          baseline = Path(".secrets.baseline")
          if not baseline.exists():
              print("ERROR: .secrets.baseline is missing")
              sys.exit(1)

          old = json.loads(baseline.read_text())
          new = json.loads(Path("/tmp/new_scan.json").read_text())
          old_set = {
              (path, item["hashed_secret"], item["line_number"])
              for path, items in old.get("results", {}).items()
              for item in items
          }
          new_set = {
              (path, item["hashed_secret"], item["line_number"])
              for path, items in new.get("results", {}).items()
              for item in items
          }
          diff = new_set - old_set
          if diff:
              print(f"ERROR: {len(diff)} new secret(s) not in baseline:")
              for path, _, line in sorted(diff):
                  print(f"  {path}:{line}")
              sys.exit(1)
          print(f"OK: {len(new_set)} known, 0 new")
          PY
